# Every pull request, and every push to master: Karpo builds and its tests run (CONTRIBUTING.md).
#
# The suite was written on the PC Karpo is made on, and two things about that PC are given to the
# runner here rather than left to chance: its time zone (the forecasts' and the tides' tests read
# hours as that PC's clock tells them) and nothing else. KARPO_UI_TESTS is not set, so the tests that
# open windows are skipped, as they are in a plain `dotnet test`.

name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The time zone the tests were written in
        shell: pwsh
        run: tzutil /s "W. Europe Standard Time"

      - name: Build
        shell: pwsh
        run: dotnet build Karpo.Tests --nologo -v minimal

      - name: Test
        shell: pwsh
        run: dotnet test Karpo.Tests --no-build --nologo -v minimal
